<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="InfraJournal local dashboard for infrastructure architecture, dependencies, warnings and decisions."
    />
    <meta name="theme-color" content="#070a0b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>InfraJournal · Local dashboard</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = window.localStorage.getItem("infrajournal-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (_error) {
        // Storage can be unavailable in hardened local browsers.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
