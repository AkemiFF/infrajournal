upstream journal_web {
    server web:3000;
    keepalive 16;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;

    server_name journal.example.com www.journal.example.com;

    ssl_certificate /etc/nginx/certs/journal.example.com.pem;
    ssl_certificate_key /etc/nginx/certs/journal.example.com.key;

    location / {
        proxy_pass http://journal_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://web:3000/api/;
        proxy_set_header Host $host;
    }
}
